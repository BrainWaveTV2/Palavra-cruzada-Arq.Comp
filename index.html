<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cruzadinha de Arquitetura Computacional</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Cruzadinha de Arquitetura Computacional</h1>
  <p class="intro">Leia as pistas, digite as letras direto nas casas e clique em Conferir.</p>

  <div class="botoes">
    <button id="btnConferir">Conferir</button>
    <button id="btnReiniciar">Reiniciar</button>
    <span id="contador">0 de 16 palavras</span>
  </div>
  <p id="mensagem"></p>

  <div class="jogo">
    <div id="tabuleiro"></div>

    <div class="pistas">
      <h2>Horizontais</h2>
      <ul id="listaH"></ul>

      <h2>Verticais</h2>
      <ul id="listaV"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
